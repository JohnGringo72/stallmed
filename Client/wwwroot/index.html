<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StallmedManager</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StallmedManager.Client.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.downloadFileFromBytes = function (fileName, bytes) {
            const blob = new Blob([new Uint8Array(bytes)], {
                type: 'application/octet-stream'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.selectAll = function (id) {
            const el = document.getElementById(id);
            if (el) { el.select(); }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/gr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.initDatePicker = (elementId, dotNetRef, defaultDate) => {
            flatpickr("#" + elementId, {
                dateFormat: "d/m/Y",
                locale: "gr",
                defaultDate: defaultDate,
                onChange: function (selectedDates, dateStr) {
                    dotNetRef.invokeMethodAsync('SetDate', elementId, dateStr);
                }
            });
        };

        window.chartInstances = {};

        window.renderBarChart = (canvasId, labels, data, prevLabels, prevData) => {
            if (window.chartInstances[canvasId]) {
                window.chartInstances[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const datasets = [{
                label: 'Τρέχουσα περίοδος',
                data: data,
                backgroundColor: '#4a90d9',
                borderRadius: 6,
                order: 1
            }];

            if (prevData && prevData.length > 0) {
                datasets.push({
                    label: 'Προηγούμενη περίοδος',
                    data: prevData,
                    backgroundColor: 'rgba(230, 126, 34, 0.6)',
                    borderColor: '#e67e22',
                    borderWidth: 1,
                    borderRadius: 4,
                    type: 'bar',
                    order: 2
                });
            }

            window.chartInstances[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 11 },
                                boxWidth: 14
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        };

        window.renderPieChart = (canvasId, labels, data, colors) => {
            if (window.chartInstances[canvasId]) {
                window.chartInstances[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            window.chartInstances[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        };
    </script>

</body>
</html>
