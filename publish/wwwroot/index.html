    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="alternate icon" type="image/png" href="favicon.png" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#212529" />
    <link rel="apple-touch-icon" href="images/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

</head>
<body>
    <div id="app">
        <div class="sbt-loading">
            <div class="sbt-loading-ring">
                <svg class="loading-progress">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
                <img src="images/sbt-suite-logo.svg" alt="SBT Suite" width="60" />
            </div>
            <div class="sbt-loading-text">
                <span style="font-weight:800;color:#0f2b46;">SBT</span>
                <span style="font-weight:400;color:#4fd1c5;">Suite</span>
            </div>
            <div class="loading-progress-text"></div>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.downloadFileFromBytes = function (fileName, bytes) {
            const blob = new Blob([new Uint8Array(bytes)], {
                type: 'application/octet-stream'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // Προβολή αρχείου σε νέα καρτέλα (εικόνες/PDF ανοίγουν inline στον browser).
        window.openFileFromBytes = function (fileName, contentType, bytes) {
            const blob = new Blob([new Uint8Array(bytes)], {
                type: contentType || 'application/octet-stream'
            });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        };

        // Inline προεπισκόπηση (img/iframe μέσα στη σελίδα): φτιάχνει blob URL
        // που πρέπει να απελευθερωθεί με revokeObjectUrl όταν κλείσει η προβολή.
        window.createObjectUrlFromBytes = function (contentType, bytes) {
            const blob = new Blob([new Uint8Array(bytes)], {
                type: contentType || 'application/octet-stream'
            });
            return URL.createObjectURL(blob);
        };
        window.revokeObjectUrl = function (url) {
            try { URL.revokeObjectURL(url); } catch (e) { }
        };

        // Ειδοποιήσεις του λειτουργικού για νέα θέματα (Tasks).
        // Χρειάζεται HTTPS. Σε Android Chrome ο constructor δεν υποστηρίζεται
        // (θέλει service worker) -- τότε επιστρέφει false και μένει μόνο το σήμα στο μενού.
        window.sbtNotify = {
            supported: function () { return "Notification" in window; },
            permission: function () { return ("Notification" in window) ? Notification.permission : "unsupported"; },
            request: async function () {
                if (!("Notification" in window)) return "unsupported";
                try { return await Notification.requestPermission(); } catch (e) { return "denied"; }
            },
            show: function (title, body) {
                if (!("Notification" in window) || Notification.permission !== "granted") return false;
                try {
                    new Notification(title, { body: body, icon: "/favicon.png" });
                    return true;
                } catch (e) {
                    // Android: μόνο μέσω service worker.
                    if (!("serviceWorker" in navigator)) return false;
                    navigator.serviceWorker.ready
                        .then(function (r) { return r.showNotification(title, { body: body, icon: "/images/app/icon-192.png" }); })
                        .catch(function () { });
                    return true;
                }
            }
        };

        // ---- Ειδοποιήσεις Push (κινητό/desktop, και με κλειστή την εφαρμογή) ----
        // Ο service worker (service-worker.js) δείχνει τις ειδοποιήσεις· εδώ γίνεται
        // η εγγραφή της συσκευής. iPhone: μόνο iOS 16.4+ ΚΑΙ αφού μπει στην αρχική οθόνη.
        window.sbtPush = (function () {
            let regPromise = null;
            function register() {
                if (!("serviceWorker" in navigator)) return Promise.resolve(null);
                if (!regPromise) {
                    regPromise = navigator.serviceWorker.register("/service-worker.js", { scope: "/" })
                        .then(function () { return navigator.serviceWorker.ready; })
                        .catch(function () { return null; });
                }
                return regPromise;
            }
            function b64ToBytes(b64) {
                const pad = "=".repeat((4 - b64.length % 4) % 4);
                const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
                const out = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
                return out;
            }
            function toPayload(sub) {
                const j = sub.toJSON();
                return { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, userAgent: navigator.userAgent };
            }
            const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

            // Πάτημα ειδοποίησης με ανοιχτή την εφαρμογή: πλοήγηση χωρίς επαναφόρτωση.
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.addEventListener("message", function (e) {
                    if (!e.data || e.data.type !== "sbt-navigate") return;
                    if (window.Blazor && typeof Blazor.navigateTo === "function") Blazor.navigateTo(e.data.url);
                    else window.location.href = e.data.url;
                });
            }
            register();

            return {
                // "unsupported" | "ios-needs-install" | "default" | "granted" | "denied"
                state: function () {
                    if (isIos && !isStandalone) return "ios-needs-install";
                    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
                        return "unsupported";
                    return Notification.permission;
                },
                // Ζητάει άδεια (πρέπει να κληθεί από κλικ) και επιστρέφει τη συνδρομή για τον server.
                subscribe: async function (publicKey) {
                    const perm = await Notification.requestPermission();
                    if (perm !== "granted") return { error: perm };
                    const reg = await register();
                    if (!reg) return { error: "no-sw" };
                    let sub = await reg.pushManager.getSubscription();
                    if (!sub) {
                        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
                    }
                    return toPayload(sub);
                },
                // Υπάρχουσα συνδρομή της συσκευής (χωρίς να ρωτήσει τον χρήστη) -- ή null.
                current: async function () {
                    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
                    if (!("Notification" in window) || Notification.permission !== "granted") return null;
                    const reg = await register();
                    if (!reg) return null;
                    const sub = await reg.pushManager.getSubscription();
                    return sub ? toPayload(sub) : null;
                },
                // Αριθμός πάνω στο εικονίδιο της εφαρμογής (όπου υποστηρίζεται).
                setBadge: function (count) {
                    try {
                        if (count > 0 && navigator.setAppBadge) navigator.setAppBadge(count);
                        else if (navigator.clearAppBadge) navigator.clearAppBadge();
                    } catch (e) { }
                }
            };
        })();

        window.selectAll = function (id) {
            const el = document.getElementById(id);
            if (el) { el.select(); }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/gr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.initDatePicker = (elementId, dotNetRef, defaultDate) => {
            flatpickr("#" + elementId, {
                dateFormat: "d/m/Y",
                locale: "gr",
                defaultDate: defaultDate,
                onChange: function (selectedDates, dateStr) {
                    dotNetRef.invokeMethodAsync('SetDate', elementId, dateStr);
                }
            });
        };

        window.chartInstances = {};

        window.renderBarChart = (canvasId, labels, data, prevLabels, prevData) => {
            if (window.chartInstances[canvasId]) {
                window.chartInstances[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const datasets = [{
                label: 'Τρέχουσα περίοδος',
                data: data,
                backgroundColor: '#4a90d9',
                borderRadius: 6,
                order: 1
            }];

            if (prevData && prevData.length > 0) {
                datasets.push({
                    label: 'Προηγούμενη περίοδος',
                    data: prevData,
                    backgroundColor: 'rgba(230, 126, 34, 0.6)',
                    borderColor: '#e67e22',
                    borderWidth: 1,
                    borderRadius: 4,
                    type: 'bar',
                    order: 2
                });
            }

            window.chartInstances[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 11 },
                                boxWidth: 14
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        };

        // Σύγκριση ετών: 12 μήνες στον άξονα, μία ομάδα στηλών ανά μήνα.
        window.renderYearlyBarChart = (canvasId, years, seriesData) => {
            if (window.chartInstances[canvasId]) {
                window.chartInstances[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const months = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μάι", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];
            const palette = ["#4a90d9", "#e67e22", "#2ecc71", "#9b59b6", "#e74c3c", "#1abc9c", "#f39c12", "#34495e"];

            const datasets = years.map((year, i) => ({
                label: String(year),
                data: seriesData[i],
                backgroundColor: palette[i % palette.length],
                borderRadius: 4
            }));

            window.chartInstances[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: { labels: months, datasets: datasets },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: true, position: 'top', labels: { font: { size: 11 }, boxWidth: 14 } },
                        tooltip: { callbacks: { title: (items) => items[0].label } }
                    },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        };

        window.renderPieChart = (canvasId, labels, data, colors) => {
            if (window.chartInstances[canvasId]) {
                window.chartInstances[canvasId].destroy();
            }
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            window.chartInstances[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        };

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
